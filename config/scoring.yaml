  - name: "跨金属方法参考"
    multiplier: 1.0
    required_groups:
      - &metals ["Ti-6Al-4V", "TC4", "titanium", "aluminum", "aluminium", "magnesium", "steel", "copper", "nickel", "Inconel", "metal", "alloy"]
