weights:
  similarity: 0.68
  recency: 0.12
  citations: 0.08
  altmetric: 0.02
  journal_quality: 0.06
  author_bonus: 0.00
  venue_bonus: 0.04

# Every scoring component is clamped to [0, 1] (see src/score_rank.py), so with the
# weights above summing to 1.0 the final score is also in [0, 1] and these
# thresholds are comparable across runs.
#
# Calibrated on a live run against the full 4399-paper profile:
#   p50=0.522  p75=0.602  p90=0.655  p99=0.713  max=0.774
# must_read 0.70 sits just below p99 and selects ~3% (21 of 708), which matches a
# digest capped at 20 items. consider was raised from 0.45, where it admitted 76%
# of candidates and so carried almost no information; 0.52 is the median.
# Re-check these numbers after any change to config/embedding.yaml -- the log line
# "Score distribution over N ranked works" prints them every run.
thresholds:
  must_read: 0.70
  consider: 0.52

scales:
  # Recency is exp(-ln2 * days / half_life) instead of a step function.
  # 21 days means a paper published 3 weeks ago still scores 0.5.
  recency_half_life_days: 21
  # Citation count saturates here. New papers have zero citations by definition,
  # so this term must stay a tie-breaker and never a ranking driver.
  citation_saturation: 50
  altmetric_saturation: 100
  # SJR is mapped from sjr_floor -> 0 to sjr_ceiling -> 1 in log space.
  sjr_floor: 0.3
  sjr_ceiling: 4.0
  # Venues absent from data/journal_metrics.csv score slightly below average
  # rather than receiving the same value as a top journal.
  journal_unknown: 0.25

# Retained so older configs keep loading; no longer used by the recency term.
decay_days:
  fast: 3
  medium: 7
  slow: 30
whitelist_authors: []
# First match wins. Coefficients are adjustable heuristics, not probabilities.
#
# ORDER MATTERS: rules are evaluated top to bottom and the first match decides the
# multiplier, so the most specific and highest-value rule must come first.
#
# 跨金属方法参考 is ×1.0, the same as TC4 核心研究, on the owner's instruction: a paper on
# another metal that follows the same chain -- temperature / strain rate / stress state ->
# plasticity, ductile fracture, damage evolution -> constitutive calibration -> user material
# subroutine -> ballistic validation -- is worth reading just as much. Only the material
# system differs, so the parameters cannot be copied; the value does not differ. The two
# rules stay separate so the report can still label which is which.
# "外围方法参考" is last precisely because it used to sit at the top and demote core
# work by 30% whenever the title happened to mention a peripheral keyword, e.g.
# "Ductile fracture of coated Ti-6Al-4V under dynamic loading" matched "coating"
# before it could ever reach the TC4 rule.
default_priority_multiplier: 0.90
research_priorities:
  - name: "TC4核心研究"
    multiplier: 1.0
    required_groups:
      - ["Ti-6Al-4V", "TC4", "titanium alloy", "钛合金"]
      - ["constitutive", "ductile fracture", "fracture criterion", "damage evolution", "damage initiation", "flow stress", "strain hardening", "stress triaxiality", "Lode", "strain rate", "dynamic tension", "dynamic compression", "thermoviscoplastic", "thermo-viscoplastic", "thermal softening", "ballistic", "penetration", "perforation", "Johnson-Cook", "GISSMO", "本构", "延性断裂", "损伤演化", "应力状态", "应变率", "屈服", "侵彻"]
      - &mechanics ["constitutive", "plasticity", "plastic", "hardening", "flow stress", "yield", "yielding", "fracture", "damage", "ductility", "ductile", "stress strain", "Johnson-Cook", "GISSMO", "failure", "ballistic limit", "塑性", "本构", "断裂", "损伤", "硬化", "屈服", "侵彻"]
  # 外围方法参考只让 TC4核心研究 排在它前面，其余全部让位。
  #
  # 2026-09-19 试跑暴露了顺序问题：这条规则对该管的论文一次都没生效过。
  #   - 涂层（Cr2AlC on H13 steel）、热变形（AA3102、近α钛）标题里明明有 coating /
  #     hot deformation，却拿了 ×1.0——「其他金属」只要 金属 + constitutive 就先认走了。
  #   - 腐蚀那篇（Ti/CeO2）更隐蔽：被「反演/数值实现」用 "fracture energy" 认走。那个词
  #     在方法规则里本意是数值正则化参数（配 characteristic length、nonlocal damage），
  #     这篇里却是材料韧性。关键词无法消歧，只能让降权规则排在它前面。
  #
  # 上移不会重蹈覆辙：从前的坑是它排在**最顶上**，连 "Ductile fracture of coated
  # Ti-6Al-4V under dynamic loading" 都要降 30%。现在 TC4核心研究 仍在它前面，核心工作
  # 照样先被认走。代价是「铝合金热轧方向对动态断裂的影响」这类落到 0.70，可以接受。
  - name: "外围方法参考"
    multiplier: 0.70
    match_fields: title
    required_groups:
      - [# 2026-09-19 本人确认砍掉：热变形/锻造。属热加工工艺范畴（Arrhenius/Zener-Hollomon、
         # 800-1000°C 低应变率成形），与冲击失效链不是一个区间。真正的 TC4 高温本构仍由
         # TC4核心研究 以 ×1.0 认走，不受影响。
         "hot deformation", "hot working", "hot compression", "hot rolling", "hot forming",
         "thermomechanical processing", "forging", "extrusion", "superplastic",
         "热变形", "热加工", "锻造", "挤压",
         # 2026-09-19 本人确认砍掉：涂层 / 腐蚀 / 复合材料。
         "corrosion", "coating", "coated", "cold spray", "cold-sprayed", "thermal barrier",
         "CFRP", "GFRP", "fiber-reinforced", "fibre-reinforced", "laminate", "sandwich panel",
         "涂层", "腐蚀", "复合材料",
         # 原有外围主题
         "fatigue performance", "creep damage", "lattice structure", "molecular dynamics",
         "atomistic simulation", "machining", "welding", "concrete", "cement", "polymer",
         "ceramic", "biomedical", "implant", "混凝土", "水泥", "聚合物", "陶瓷", "生物医学"]
  # One category, two alternative matching routes: identification/numerics method
  # papers, and constitutive/fracture work on other metals.
  - name: "跨金属方法参考"
    multiplier: 1.0
    required_groups:
      - ["LS-OPT", "inverse identification", "inverse parameter identification", "parameter identification", "parameter calibration", "parameter inversion", "inverse calibration", "inverse modeling", "inverse modelling", "finite element model updating", "parameter identifiability", "parameter sensitivity", "uncertainty quantification", "Bayesian calibration", "multi-objective calibration", "post-necking", "hardening extrapolation", "inverse finite element identification", "full-field identification", "virtual fields method", "integrated digital image correlation", "Bridgman correction", "FEMU", "VFM", "mesh dependency", "mesh dependence", "mesh objectivity", "damage regularization", "damage regularisation", "characteristic length", "fracture energy", "nonlocal damage", "element size sensitivity", "element deletion", "model validation", "cross-validation", "return mapping", "stress integration", "consistent tangent", "user-defined material", "VUMAT", "UMAT", "UMAT41", "MAT_224", "反演", "参数标定", "数字图像相关", "颈缩后", "有限元更新", "网格客观性", "损伤正则化"]
      - *mechanics
  - name: "跨金属方法参考"
    multiplier: 1.0
    required_groups:
      - ["aluminum", "aluminium", "magnesium", "steel", "copper", "nickel", "Inconel", "metal", "alloy"]
      - ["constitutive", "ductile fracture", "fracture criterion", "damage evolution", "stress triaxiality", "Lode", "flow stress", "hardening", "Gurson", "GTN", "MMC", "GISSMO", "Johnson-Cook"]
  # 表征主导也只看标题，与 外围方法参考 按倍率递减排：0.70 在前，0.55 在后。
  # 表征主导：标题本身讲的是表征手段或组织演变，而不是力学响应或模型。
  # 2026-09-19 本人指出「研究各种表征手段、EBSD、TEM 这些东西的，太偏材料不偏力学」。
  #
  # 只看标题是刻意的：一篇真正相关的论文在断口分析里用 EBSD 很正常，不该因此降权；
  # 标题就叫 "EBSD characterization of ..." 的，研究对象就是表征本身。
  # 降权而非排除：万一某篇组织论文确实给了你要的断裂数据，它还排得进来，只是靠后。
  - name: "表征主导"
    multiplier: 0.55
    match_fields: title
    required_groups:
      - ["EBSD", "electron backscatter", "TEM", "transmission electron", "SEM",
         "scanning electron", "XRD", "X-ray diffraction", "atom probe", "electron microscopy",
         "microstructural characterization", "microstructural characterisation",
         "microstructure characterization", "microstructure characterisation",
         "materials characterization", "materials characterisation",
         "microstructural evolution", "microstructure evolution", "texture evolution",
         "phase transformation", "precipitation behavior", "precipitation behaviour",
         "grain refinement", "recrystallization", "recrystallisation",
         "strength-ductility synergy", "strength-ductility trade-off",
         "显微组织", "组织演变", "织构演化", "相变行为"]
  - name: "机制参考"
    multiplier: 0.85
    required_groups:
      - ["Ti-6Al-4V", "TC4", "titanium", "aluminum", "aluminium", "magnesium", "steel", "copper", "nickel", "Inconel", "metal", "alloy"]
      - ["crystal plasticity", "single crystal", "bicrystal", "process-microstructure", "microstructure engineering", "martensite decomposition", "texture-induced anisotropy", "hot isostatic pressing", "defect morphology", "lack of fusion", "porosity", "build orientation", "build direction", "crystallographic texture", "columnar grains", "prior beta grains", "deformation twinning", "slip system", "EBSD", "fractography", "heat treatment", "heat treated"]
      # "mechanical properties" / "mechanical behavior" / "strength" / bare "deformation"
      # were removed for the same reason as in config/sources.yaml: they are boilerplate
      # and proved nothing, so a microstructure paper landed here at only -15%.
      - ["plastic deformation", "anisotropy", "ductility", "fracture", "damage", "plasticity", "hardening", "flow stress", "stress strain", "failure"]
