name: Weekly Watch & RSS

# Serialize delivery history and publication; never cancel an in-flight email.
#
# Dry runs get their own group. GitHub keeps one PENDING run per group and cancels the
# older one when another arrives, so a dry run dispatched while a scheduled run was
# queued behind a running one would silently cancel that week's delivery.
concurrency:
  group: ${{ inputs.dry_run && 'zotwatch-dry-run' || 'zotwatch-delivery' }}
  cancel-in-progress: false

# Deliberately NOT triggered by `push`. A push trigger used to run the whole
# pipeline on every commit to main, so a normal day of development sent several
# "weekly" emails, burned the OpenAlex/Crossref budget several times over, and --
# worst of all -- marked those papers as already delivered, so they never appeared
# in the real Thursday digest. Code changes are validated by ci.yml instead.
on:
  # PRIMARY TRIGGER IS EXTERNAL. An outside scheduler (cron-job.org) calls the
  # workflow_dispatch API at 15:00 Thursday Beijing (retry 17:00) with trigger=scheduled;
  # a dispatch starts within seconds and the run takes ~30 minutes, so the email lands
  # around 15:30. GitHub's own schedule cannot be made punctual: the docs say
  # scheduled events "can be delayed during periods of high loads" and may be dropped,
  # and in June 2026 the Actions product manager called the throttle "global" and said
  # no time of day is reliably better. Measured here: 5h09m late on 2026-09-24,
  # 7h08m on 2026-10-01. Setup steps: docs/precise-schedule.md.
  #
  # The crons below are only the fallback for a week the external call fails. The
  # guard job makes every extra trigger harmless: the first run to deliver records the
  # week, and any later one exits in seconds.
  schedule:
    # Fallback only. Beijing is UTC+8, so 15:30 Thursday Beijing = 07:30 Thursday UTC --
    # after the external 15:00 trigger, so on a normal week these find the ledger and exit.
    - cron: "30 7 * * 4"
    - cron: "30 9 * * 4"
    - cron: "30 11 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the digest without emailing, publishing or recording history"
        type: boolean
        default: false
      trigger:
        # The external scheduler sends "scheduled"; leave "manual" when running by hand.
        description: "scheduled = weekly delivery (deduplicated per ISO week); manual = always run"
        type: choice
        options: [manual, scheduled]
        default: manual

jobs:
  # Cheap gate: has this week's scheduled digest already gone out? Costs a few
  # seconds when it skips.
  # workflow_dispatch is never gated -- a manual run is an explicit instruction.
  #
  # Keyed on the Beijing ISO WEEK, not the calendar date. The first version keyed on
  # "today's report file" and failed on 2026-10-01: GitHub started the 09:30 UTC slot
  # 7 hours late, at 00:38 Beijing on 10-02, so it looked for report-20261002.html,
  # did not find it, and sent a second digest. Any delay that crosses midnight did that.
  #
  # Reads the marker from the LATEST origin/main, not the commit this run was queued
  # on. A run that sat in GitHub's schedule queue for hours carries a github.sha from
  # before the earlier run pushed its marker, so a plain checkout cannot see it.
  #
  # "Scheduled origin" = the GitHub cron, or the external scheduler, which dispatches
  # with trigger=scheduled. Only those are gated and only those write the marker. A run
  # you start by hand is never gated and never suppresses the Thursday digest.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      scheduled: ${{ steps.check.outputs.scheduled }}
      week: ${{ steps.check.outputs.week }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          TRIGGER: ${{ inputs.trigger }}
          DRY: ${{ inputs.dry_run }}
          # Not assumed present on every event payload; an empty branch made `git show
          # origin/:...` fail, read as "no ledger", and let every fallback cron deliver.
          BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          BRANCH="${BRANCH:-main}"
          week="$(TZ=Asia/Shanghai date +%G-W%V)"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          # GitHub's API does not say which cron slot fired a run, so the log has to.
          echo "event=$EVENT schedule='$SCHEDULE' trigger='$TRIGGER' dry_run='$DRY' started=$(date -u +%FT%TZ)"
          if [ "$DRY" = "true" ]; then
            # A dry run sends nothing and records nothing, so it can never collide.
            echo "scheduled=false" >> "$GITHUB_OUTPUT"
            echo "Dry run; not gated."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "schedule" ] || [ "$TRIGGER" = "scheduled" ]; then
            echo "scheduled=true" >> "$GITHUB_OUTPUT"
          else
            echo "scheduled=false" >> "$GITHUB_OUTPUT"
            echo "Manual run; not gated."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed fetch must not fail the guard -- that would skip the week outright.
          # Fall back to the checked-out copy, which is older but still a ledger.
          ledger_path=data/watch-state/scheduled-deliveries.json
          if git fetch --quiet origin "$BRANCH" && git cat-file -e "origin/$BRANCH:$ledger_path" 2>/dev/null; then
            ledger="$(git show "origin/$BRANCH:$ledger_path")"
          elif [ -f "$ledger_path" ]; then
            echo "::warning::Could not read the ledger from origin/$BRANCH; using the checked-out copy."
            ledger="$(cat "$ledger_path")"
          else
            ledger='{}'
          fi
          # Exit codes: 0 delivered, 1 not delivered, 2 ledger unreadable.
          set +e
          printf '%s' "$ledger" | WEEK="$week" python3 -c "
          import json, os, sys
          try:
              data = json.load(sys.stdin)
          except ValueError:
              sys.exit(2)
          sys.exit(0 if isinstance(data, dict) and os.environ['WEEK'] in data else 1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::notice::The $week digest was already delivered. Skipping this scheduled run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            # Deliver rather than skip: a duplicate email is recoverable, a lost week is not.
            echo "::warning::The delivery ledger is unreadable; delivering, which may duplicate this week's digest."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No delivery recorded for $week yet; this run delivers."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  watch:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # 60, not 50: the method-comparison section (2026-10-05) may add up to 8 minutes
    # (method_deadline_seconds), and recent runs already took 30-35.
    timeout-minutes: 60
    permissions:
      actions: read
      issues: read
      contents: write
      pages: write
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
      ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
      ALTMETRIC_KEY: ${{ secrets.ALTMETRIC_KEY }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      AMINER_API_KEY: ${{ secrets.AMINER_API_KEY }}
      # Secret rather than variable: this repository is public, so its Actions
      # logs are public too, and only secrets are masked there. A variable would
      # print the address in plain text. Accepts a comma-separated list.
      EMAIL_TO: ${{ vars.EMAIL_TO || secrets.EMAIL_TO }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      # The branch head, not the SHA the run was queued with. A run that waited in the
      # concurrency queue behind a manual delivery would otherwise start from history
      # that predates it, and the final rebase of state.json would conflict.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Ensure data directories
        run: mkdir -p data reports data/watch-state
      - run: pip install -r requirements.txt

      - name: Resolve embedding signature
        id: model
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, pathlib, yaml
          cfg = yaml.safe_load(pathlib.Path("config/embedding.yaml").read_text(encoding="utf-8")) or {}
          sig = "{}:{}:{}".format(
              cfg.get("provider", "openai-compatible"),
              cfg.get("model_name", ""),
              cfg.get("dimensions") or "native",
          )
          print(f"signature={sig}")
          print(f"slug={hashlib.sha256(sig.encode()).hexdigest()[:12]}")
          PY

      # Fail here rather than 40 minutes in. Email is the last step, after the
      # Pages deploy, so a missing value discovered there wastes the whole run.
      - name: Check required configuration
        run: |
          missing=0
          if [ -z "${EMBEDDING_API_KEY}" ]; then
            echo "::error::EMBEDDING_API_KEY is not set. config/embedding.yaml uses a remote provider; add the secret, or set provider to 'local' (which also needs sentence-transformers in requirements.txt)."
            missing=1
          fi
          if [ "${DRY_RUN}" != "true" ] && [ -z "${EMAIL_TO}" ]; then
            echo "::error::EMAIL_TO is not set. Add it under Settings - Secrets and variables - Actions. Use a secret, not a variable: this repository is public, so its Actions logs are public and only secrets are masked."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "Embedding signature: ${{ steps.model.outputs.signature }}"

      # The Zotero Web API only returns items synced to zotero.org; on this
      # library that is 518 of 4399 documents, so an API-built profile represents
      # 12% of the actual reading. The profile is therefore built locally from
      # zotero.sqlite (python -m src.cli profile --local --bundle) and published
      # as a draft release asset, which only accounts with write access can read.
      - name: Fetch prebuilt profile
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release download profile-latest --repo "$GITHUB_REPOSITORY" \
               --pattern profile-bundle.tar.gz --dir /tmp --clobber 2>/dev/null; then
            tar -xzf /tmp/profile-bundle.tar.gz
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = json.loads(pathlib.Path("data/profile.json").read_text(encoding="utf-8"))
          print(f"items={p.get('item_count', 0)}")
          print(f"signature={p.get('embedding_signature', '')}")
          print(f"generated={p.get('generated_at', '')}")
          PY
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No prebuilt profile release found; falling back to the Zotero Web API, which only sees synced items."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Checks the whole manifest, not just the encoder signature: schema version,
      # item_count against index_items, sqlite row count, FAISS vector count and width.
      # The old check compared one field, so a bundle could be internally inconsistent
      # -- an index shorter than the item list, vectors of the wrong width -- and still
      # be accepted, then fail or silently misbehave much later in the run.
      - name: Verify prebuilt profile
        if: steps.prebuilt.outputs.found == 'true'
        run: |
          echo "Prebuilt profile: ${{ steps.prebuilt.outputs.items }} items, generated ${{ steps.prebuilt.outputs.generated }}"
          # Rebuilt weekly on the owner's PC (tools/refresh_profile.ps1, Thursday 13:00).
          # Nothing fails when that stops -- the digest just ages -- so say it here too.
          age=$(( ( $(date +%s) - $(date -d "${{ steps.prebuilt.outputs.generated }}" +%s 2>/dev/null || date +%s) ) / 86400 ))
          if [ "$age" -gt 14 ]; then
            echo "::warning::The library profile is $age days old; the weekly local refresh may not be running."
          fi
          python -m src.cli verify-profile

      # The facet centroids are derived data: which library papers belong to each
      # research direction, averaged. That depends only on config/research.yaml and on
      # vectors already inside profile.sqlite, so it is recomputed here on every run --
      # no Zotero access, no encoder call, no bill. Previously the only way to pick up a
      # facet edit was to rebuild locally and re-upload 27 MB by hand, and on 2026-09-19
      # that manual step silently did not happen: the published bundle still carried
      # centroids from a microstructure-flavoured facet after the facet was rewritten,
      # which quietly undid half of a filtering change.
      - name: Recompute facet centroids for the current config
        if: steps.prebuilt.outputs.found == 'true'
        run: python -m src.cli rederive-profile

      # Fallback path only, when no prebuilt profile exists. restore + save with a
      # run-unique key: the previous actions/cache@v4 used a month-stamped key,
      # and cache actions do not save on a hit, so the sqlite and index each run
      # produced were discarded and every run restarted from the same snapshot.
      - name: Restore profile
        id: cache-profile
        if: steps.prebuilt.outputs.found != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/profile.sqlite
            data/faiss.index
            data/profile.json
          key: profile-${{ steps.model.outputs.slug }}-${{ github.run_id }}
          restore-keys: |
            profile-${{ steps.model.outputs.slug }}-

      - uses: actions/cache/restore@v4
        with:
          path: data/network-state
          key: network-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            network-v1-${{ github.ref_name }}-

      - name: Check delivery history
        run: |
          if [ -f data/watch-state/state.json ]; then
            echo "Delivery history present: $(python -c 'import json;print(len(json.load(open("data/watch-state/state.json"))["sent"]))') keys"
          else
            echo "::warning::No delivery history in the repository: first run, or it was removed. Historical repeats are possible this run."
          fi

      - name: Restore discovery and candidate vectors
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/aminer
            data/cache/candidate-vectors
            data/cache/entity-tracking
            data/cache/method-compare
            data/cache/aminer-abstracts
          key: candidate-v1-${{ github.ref_name }}-${{ steps.model.outputs.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            candidate-v1-${{ github.ref_name }}-${{ steps.model.outputs.slug }}-

      - name: Test topic matching and ranking
        env:
          AMINER_API_KEY: ""  # Unit tests must not consume the production AMiner credential.
        run: python -B tools/run_offline_tests.py

      - name: Read owner feedback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues?state=all&sort=updated&direction=desc&per_page=100" > data/feedback-issues.json
          count=$(jq 'length' data/feedback-issues.json)
          if [ "$count" -eq 100 ]; then
            echo "::warning::Feedback input limited to latest 100 issues; previously accepted feedback is retained in delivery state."
          fi

      - name: Build Zotero profile
        if: steps.prebuilt.outputs.found != 'true' && steps.cache-profile.outputs.cache-matched-key == ''
        run: python -m src.cli profile --full

      # --prebuilt-profile skips the Web API sync and the re-embed: the profile
      # already covers the whole library and this runner cannot see the rest of it.
      - name: Watch
        run: |
          if [ "${{ steps.prebuilt.outputs.found }}" = "true" ]; then
            python -m src.cli watch --rss --report --top 20 --defer-history --prebuilt-profile
          else
            python -m src.cli watch --rss --report --top 20 --defer-history
          fi

      - name: Save profile
        if: always() && steps.prebuilt.outputs.found != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/profile.sqlite
            data/faiss.index
            data/profile.json
          key: profile-${{ steps.model.outputs.slug }}-${{ github.run_id }}

      - name: Save retrieval checkpoint even on failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/network-state
          key: network-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save discovery and candidate vectors even on failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/aminer
            data/cache/candidate-vectors
            data/cache/entity-tracking
            data/cache/method-compare
            data/cache/aminer-abstracts
          key: candidate-v1-${{ github.ref_name }}-${{ steps.model.outputs.slug }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare Pages
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          mkdir -p public
          cp -r reports/* public/ 2>/dev/null || true
          # Reports carry a YYYYMMDD stamp, so sort by name. The previous version
          # used `ls -t`, but `cp -r` rewrites every mtime to the copy time, so
          # index.html was whichever file the copy happened to touch last.
          latest=$(ls -1 public/report-*.html 2>/dev/null | sort | tail -n 1 || true)
          if [ -n "$latest" ]; then
            cp "$latest" public/index.html
            echo "index.html <- $latest"
          fi
          {
            echo '<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>ZotWatch 历史推送</title></head><body>'
            echo '<h1>ZotWatch 历史推送</h1><ul>'
            for f in $(ls -1 public/report-*.html 2>/dev/null | sort -r); do
              n=$(basename "$f")
              echo "<li><a href=\"$n\">${n%.html}</a></li>"
            done
            echo '</ul><p><a href="feed.xml">RSS</a></p></body></html>'
          } > public/archive.html

      - uses: actions/upload-pages-artifact@v3
        if: env.DRY_RUN != 'true'
        with:
          path: ./public
      - uses: actions/deploy-pages@v4
        if: env.DRY_RUN != 'true'

      - name: Email digest
        id: email
        if: env.DRY_RUN != 'true'
        run: python -m src.cli notify

      - name: Build email preview only
        if: env.DRY_RUN == 'true'
        env:
          EMAIL_TO: dry-run@example.invalid
        run: python -m src.cli notify --dry-run

      - name: Commit successful delivery history
        if: env.DRY_RUN != 'true'
        run: python -m src.cli commit-history

      # The guard's ledger. Written only after the mail went out, only for a
      # scheduled-origin run, and keyed on the week the GUARD computed -- so a long run
      # that finishes after Sunday midnight still records the week it was started for.
      # always() + the email outcome: once the mail is out, the week must be recorded
      # even if commit-history failed, or the next fallback cron sends it again.
      - name: Record this week's scheduled delivery
        if: always() && steps.email.outcome == 'success' && needs.guard.outputs.scheduled == 'true'
        env:
          WEEK: ${{ needs.guard.outputs.week }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone
          path = pathlib.Path("data/watch-state/scheduled-deliveries.json")
          ledger = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          ledger[os.environ["WEEK"]] = {
              "delivered_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
          }
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(ledger, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"recorded {os.environ['WEEK']}")
          PY

      # Delivery history and past digests live in the repository, not in an
      # artifact. Artifacts expire after 90 days; losing the history means
      # re-sending papers already read, and losing the reports means every link in
      # an old email points at whatever the newest digest happens to be.
      - name: Persist history and reports
        if: always() && steps.email.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # zh-cache.json rides along with the delivery history. Without it every run
          # logged "0 cached" and re-translated the whole issue from scratch, so the
          # cost was paid weekly and -- worse -- a batch lost to a timeout could never
          # be repaired: on 2026-09-19 that left 8 of 27 cards with no Chinese title
          # or TLDR, permanently. Cached by a hash of title+abstract, so the next run
          # fills in whatever the last one failed to translate.
          for path in data/watch-state/state.json data/watch-state/scheduled-deliveries.json data/zh-cache.json reports/feed.xml; do
            [ -f "$path" ] && git add -f "$path"
          done
          for path in reports/report-*.html data/watch-state/aminer-shadow/*.json; do
            [ -f "$path" ] && git add -f "$path"
          done
          if git diff --cached --quiet; then
            echo "Nothing to persist"
          else
            git commit -m "chore(watch): record $(date -u +%Y-%m-%d) digest and delivery history [skip ci]"
            # Retried because the mail has already gone out by now: a lost push loses the
            # week's marker, and a fallback cron would then send the digest a second time.
            # The branch can also have moved during a long run, hence the rebase each try.
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${{ github.ref_name }}" \
                 && git push origin "HEAD:${{ github.ref_name }}"; then
                break
              fi
              # A conflicted rebase leaves the repo mid-rebase and every later attempt
              # fails instantly; abort it so the next try starts clean.
              git rebase --abort 2>/dev/null || true
              [ "$attempt" -lt 3 ] || { echo "::error::Delivery history could not be pushed after 3 attempts."; exit 1; }
              sleep $((attempt * 15))
            done
          fi

      # Optional end-to-end heartbeat (healthchecks.io or similar). Set the secret
      # HC_PING_URL to enable it; the check then alerts by email when a Thursday passes
      # without a delivered digest -- whatever the cause: the external trigger, GitHub,
      # the job or SMTP. Without the secret this step does nothing.
      - name: Heartbeat
        if: env.DRY_RUN != 'true' && needs.guard.outputs.scheduled == 'true'
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          if [ -n "${HC_PING_URL}" ]; then
            curl -fsS -m 10 --retry 3 "${HC_PING_URL}" > /dev/null || echo "::warning::Heartbeat ping failed"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-state-v1
          path: |
            data/watch-state/state.json
            reports/
          if-no-files-found: warn
          retention-days: 90
